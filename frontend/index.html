<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexVed | Advanced Legal Research</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <!-- Dark Sidebar -->
    <nav class="sidebar">
        <div class="nav-item active">
            <span class="material-icons">gavel</span>
        </div>
        <div class="nav-item" id="theme-toggle" title="Toggle Theme">
            <span class="material-icons">dark_mode</span>
        </div>
        <div class="nav-spacer"></div>
        <div class="nav-item">
            <span class="material-icons">history</span>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="chat-header">
            <div class="logo">
                <img src="logo.png" alt="LexVed Logo" class="brand-logo">
                <h1>LexVed</h1>
            </div>
            <div class="header-divider"></div>
        </header>

        <!-- Chat Area -->
        <div class="chat-container">
            <div class="chat-history" id="chat-history">
                <!-- Welcome Message -->
                <div class="message bot-message">
                    <div class="bot-icon">
                        <span class="material-icons">gavel</span>
                    </div>
                    <div class="bubble">
                        <p>Welcome to <strong>LexVed</strong>. Your hierarchical legal RAG system is fully indexed and ready.</p>
                        <p>I can assist with both <strong>Criminal</strong> and <strong>Civil</strong> law research using domain-specific filters.</p>
                    </div>
                </div>
            </div>

            <!-- Suggestions -->
            <div class="suggestions">
                <p>Legal Research Quick Starts:</p>
                <div class="suggestion-chips">
                    <button><span class="material-icons">search</span> Abhishek Banerjee Case</button>
                    <button><span class="material-icons">search</span> Indian Penal Code (IPC)</button>
                    <button><span class="material-icons">search</span> Bail Grounds 2024</button>
                </div>
            </div>

            <!-- Input Box -->
            <div class="input-area">
                <div class="input-container">
                    <span class="material-icons icon-btn">attach_file</span>
                    <input type="text" id="chat-input" placeholder="Ask anything to Gemini...">
                    <button id="send-btn">
                        <span class="material-icons">send</span> 
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 3D Wheel Control -->
    <aside class="wheel-panel">
        <div class="wheel-glow"></div>
        <div class="wheel-container">
            <div class="wheel-overlay top"></div>
            <div class="wheel" id="model-wheel">
                <!-- Dynamically populated via JS -->
            </div>
            <div class="wheel-base-glow"></div>
            <div class="wheel-overlay bottom"></div>
        </div>
        
        <!-- Up / Down arrows over the wheel -->
        <div class="wheel-arrows">
            <span class="material-icons arrow up">arrow_drop_up</span>
            <span class="material-icons arrow down">arrow_drop_down</span>
        </div>
    </aside>

    <script src="script.js"></script>
</body>
</html>
